<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ACP-Ant 控制面板</title>
<style>
:root{--bg:#0e1117;--panel:#161b24;--panel2:#1d2430;--line:#2a3342;--text:#e6e9ef;--mute:#8b95a7;--acc:#6aa8ff;--ok:#3ecf8e;--warn:#f5b84b;--bad:#ff6b6b;--off:#6b7280;--r:12px}
@media (prefers-color-scheme: light){:root{--bg:#f4f6fa;--panel:#fff;--panel2:#f0f3f8;--line:#dde3ec;--text:#1b2230;--mute:#667085;--acc:#2f6fe4}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
a{color:var(--acc)}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:8px;padding:6px 12px}
button:hover{border-color:var(--acc)}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
button.danger{color:var(--bad)}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{min-height:90px;resize:vertical}
header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:17px;margin:0;font-weight:650}
header .sp{flex:1}
main{max-width:1400px;margin:0 auto;padding:18px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:99px;font-size:12px;background:var(--panel2);border:1px solid var(--line);color:var(--mute)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--off)}
.s-ok .dot,.dot.ok{background:var(--ok)}.s-warn .dot,.s-rate .dot,.s-quota .dot{background:var(--warn)}.s-verify .dot,.s-error .dot{background:var(--bad)}.s-off .dot{background:var(--off)}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.big{font-size:22px;font-weight:650}.mute{color:var(--mute)}.small{font-size:12px}
.banner{background:rgba(245,184,75,.12);border:1px solid var(--warn);border-radius:var(--r);padding:10px 14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px}
.acc h3{margin:0;font-size:16px}
.acc .top{display:flex;align-items:center;gap:10px}
.acc .top .sp{flex:1}
.acc.off{opacity:.62}
.row{margin-top:8px}
.q{margin-top:6px}
.qg{margin-top:8px}
.qg b{font-weight:600;font-size:13px}
.qb{display:grid;grid-template-columns:58px 1fr 46px;gap:8px;align-items:center;font-size:12px;margin-top:4px}
.bar{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--ok)}
.bar i.mid{background:var(--warn)}.bar i.low{background:var(--bad)}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.acts button{padding:4px 10px;font-size:13px}
.verify{margin-top:10px;border:1px solid var(--bad);background:rgba(255,107,107,.08);border-radius:8px;padding:8px 10px}
.err{color:var(--bad);word-break:break-all}
.switch{position:relative;width:44px;height:24px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:var(--off);border-radius:99px;transition:.2s;cursor:pointer}
.switch span:before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked+span{background:var(--ok)}
.switch input:checked+span:before{transform:translateX(20px)}
h2{font-size:15px;margin:22px 0 10px}
.events{max-height:360px;overflow:auto}
.ev{display:grid;grid-template-columns:120px 70px 1fr;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:13px}
.ev.warn .t{color:var(--warn)}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-start;justify-content:center;z-index:20;overflow:auto;padding:40px 12px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(640px,100%);padding:18px 20px}
.modal h3{margin:0 0 12px}
.modal .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.field{margin-top:10px}
.field label{display:block;font-size:13px;color:var(--mute);margin-bottom:4px}
.steps{display:flex;gap:6px;margin-bottom:12px}
.steps span{flex:1;text-align:center;font-size:12px;padding:4px;border-radius:6px;background:var(--panel2);color:var(--mute)}
.steps span.on{background:var(--acc);color:#fff}
code,pre{font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
pre{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;overflow:auto;white-space:pre-wrap;word-break:break-all}
.kv{display:grid;grid-template-columns:110px 1fr auto;gap:8px;align-items:center;margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:2px 8px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);font-size:12px;cursor:pointer}
#toast{position:fixed;right:18px;bottom:18px;z-index:40;display:flex;flex-direction:column;gap:8px}
#toast div{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--acc);padding:10px 14px;border-radius:8px;max-width:420px;box-shadow:0 6px 24px rgba(0,0,0,.3)}
#toast div.bad{border-left-color:var(--bad)}#toast div.ok{border-left-color:var(--ok)}
.login{max-width:360px;margin:12vh auto;padding:0 16px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (max-width:520px){.grid{grid-template-columns:1fr}.ev{grid-template-columns:90px 1fr}.ev .a{display:none}header{padding:10px}}
</style>
</head>
<body>
<div id="loginView" class="login" style="display:none">
  <div class="card">
    <h2 style="margin-top:0">ACP-Ant 控制面板</h2>
    <p class="mute small">请输入管理员密码。第一次使用时，初始密码在服务器的 <code>panel-initial-password.txt</code> 里。</p>
    <div class="field"><input id="pw" type="password" placeholder="管理员密码" autocomplete="current-password"></div>
    <div class="field"><button class="primary" style="width:100%" id="loginBtn">登录</button></div>
    <p id="loginErr" class="err small"></p>
  </div>
</div>

<div id="appView" style="display:none">
  <header>
    <h1>ACP-Ant 控制面板</h1>
    <span class="pill" id="srvPill"><span class="dot"></span><span>连接中</span></span>
    <span class="sp"></span>
    <button class="primary" data-top="add">＋ 添加账号</button>
    <button data-top="quotaAll">刷新全部额度</button>
    <button data-top="proxies">代理记录</button>
    <button data-top="connect">接入信息</button>
    <button data-top="test">在线测试</button>
    <button data-top="settings">设置</button>
    <button data-top="logout">退出</button>
  </header>
  <main>
    <div id="banner"></div>
    <div class="summary" id="summary"></div>
    <div class="grid" id="accounts"></div>
    <h2>最近事件</h2>
    <div class="card events" id="events"></div>
    <p class="mute small" style="margin-top:14px">每 10 秒自动刷新。额度每 10 分钟缓存一次，点「刷新额度」立即重读（读取额度不消耗额度）。</p>
    <p class="mute small">ACP-Ant · 开源项目</p>
  </main>
</div>

<div class="mask" id="mask"><div class="modal" id="modal"></div></div>
<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let DATA = null, TIMER = null, CONNECT = null;

async function api(path, opt = {}) {
  const r = await fetch("/panel/api" + path, {method: opt.method || (opt.body !== undefined ? "POST" : "GET"),
    headers: {"Content-Type": "application/json", "X-ACP-Panel": "1"}, credentials: "same-origin",
    body: opt.body !== undefined ? JSON.stringify(opt.body) : undefined});
  if (r.status === 401 && path !== "/login") { showLogin(); throw new Error("请先登录"); }
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.detail || ("请求失败 HTTP " + r.status));
  return d;
}
function toast(msg, kind = "") { const d = document.createElement("div"); d.className = kind; d.textContent = msg; $("#toast").appendChild(d); setTimeout(() => d.remove(), kind === "bad" ? 9000 : 5000); }
function ago(ts) { if (!ts) return "从未"; const s = Math.max(0, Date.now() / 1000 - ts); if (s < 60) return "刚刚"; if (s < 3600) return Math.floor(s / 60) + " 分钟前"; if (s < 86400) return Math.floor(s / 3600) + " 小时前"; return Math.floor(s / 86400) + " 天前"; }
function until(iso) { if (!iso) return ""; const s = (new Date(iso).getTime() - Date.now()) / 1000; if (s <= 0) return "已重置"; if (s < 3600) return Math.ceil(s / 60) + " 分钟后重置"; if (s < 86400) return Math.floor(s / 3600) + " 小时 " + Math.floor(s % 3600 / 60) + " 分后重置"; return Math.floor(s / 86400) + " 天 " + Math.floor(s % 86400 / 3600) + " 小时后重置"; }
function num(n) { n = n || 0; return n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e3 ? (n / 1e3).toFixed(1) + "k" : String(n); }
function clock(ts) { const d = new Date(ts * 1000); return (d.getMonth() + 1) + "-" + d.getDate() + " " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0") + ":" + String(d.getSeconds()).padStart(2, "0"); }
const GROUP = {"Gemini Models": "Gemini 模型", "Claude and GPT models": "Claude / GPT 模型", "Gemini 4 Argon": "Gemini 4 Argon"};
const WIN = {"weekly": "每周", "5h": "5 小时"};
const KIND = {VERIFY: "需要 Google 验证", QUOTA: "额度用完", RATE_LIMIT: "被限流", UPSTREAM_LIMIT: "上游拒绝(429)", AUTH: "登录失效", BLOCKED: "审核拦截",
  TIMEOUT: "超时", TRANSPORT: "进程断开", BAD_REQUEST: "请求有误", UNKNOWN_MODEL: "模型不存在", SERVER: "服务出错", CONFIG: "配置问题", NO_ACCOUNT: "没有可用账号"};
function kindText(t) { return String(t || "").replace(/^([A-Z_]+):/, (m, k) => (KIND[k] || k) + "："); }

function showLogin() { clearInterval(TIMER); $("#appView").style.display = "none"; $("#loginView").style.display = "block"; setTimeout(() => $("#pw").focus(), 50); }
async function doLogin() {
  $("#loginErr").textContent = "";
  try { await api("/login", {body: {password: $("#pw").value}}); $("#pw").value = ""; start(); }
  catch (e) { $("#loginErr").textContent = e.message; }
}
$("#loginBtn").onclick = doLogin;
$("#pw").onkeydown = e => { if (e.key === "Enter") doLogin(); };

async function start() {
  $("#loginView").style.display = "none"; $("#appView").style.display = "block";
  await refresh(); clearInterval(TIMER); TIMER = setInterval(refresh, 10000);
}
async function refresh() {
  try {
    DATA = await api("/overview");
    const ev = await api("/events");
    render(); renderEvents(ev.events);
  } catch (e) { if (e.message !== "请先登录") $("#srvPill").innerHTML = '<span class="dot" style="background:var(--bad)"></span><span>连不上：' + esc(e.message) + "</span>"; }
}

function render() {
  const s = DATA.server, t = DATA.today;
  $("#srvPill").innerHTML = '<span class="dot ok"></span><span>运行中 · v' + esc(s.version) + " · 已运行 " + esc(ago(s.started).replace("前", "")) + "</span>";
  const u = DATA.update || {};
  $("#banner").innerHTML = (s.initial_password ? '<div class="banner">你还在用初始密码。建议点右上角「设置」改成自己的密码（改完服务器上的初始密码文件会自动删除）。</div>' : "") +
    (u.available ? '<div class="banner">🎉 发现新版本 <b>v' + esc(u.latest) + "</b>（当前 v" + esc(u.current) + '）。 <button class="primary" onclick="updateModal()">查看更新内容' + (u.can_apply ? "并更新" : "") + "</button></div>" : "") +
    (u.state === "running" || u.state === "restarting" ? '<div class="banner"><span class="spin"></span> 正在更新… <button onclick="updateModal()">查看进度</button></div>' : "");
  $("#summary").innerHTML = [
    ["账号", s.usable + " / " + s.accounts, "可用 / 总数"],
    ["今日请求", t.ok + " / " + t.fail, "成功 / 失败"],
    ["今日 Token", num(t.in) + " / " + num(t.out), "输入 / 输出（含思考）"],
    ["正在处理 / 同时上限", s.inflight + " / " + s.usable * s.per_account,
     "每个账号同时 " + s.per_account + " 个 · " + (s.waiting ? '<span class="err">排队 ' + s.waiting + " 个</span>" : "无排队")],
  ].map(([a, b, c]) => '<div class="card"><div class="mute small">' + a + '</div><div class="big">' + esc(b) + '</div><div class="mute small">' + c + "</div></div>").join("");
  $("#accounts").innerHTML = DATA.accounts.length ? DATA.accounts.map(cardHtml).join("") :
    '<div class="card">还没有账号。点右上角「＋ 添加账号」，按提示填代理并登录 Google。</div>';
}

function quotaHtml(a) {
  if (a.quota_error) return '<div class="row err small">读取额度失败：' + esc(a.quota_error) + "</div>";
  if (!a.quota) return '<div class="row mute small"><span class="spin"></span> 正在读取额度…</div>';
  return a.quota.map(g => '<div class="qg"><b>' + esc(GROUP[g.group] || g.group) + "</b>" + g.buckets.map(b => {
    const p = Math.max(0, Math.min(100, Math.round((b.remaining ?? 0) * 1000) / 10));
    const cls = p > 50 ? "" : p > 20 ? "mid" : "low";
    return '<div class="qb" title="' + esc(b.description) + '"><span class="mute">' + esc(WIN[b.window] || b.name || b.window) +
      '</span><span class="bar"><i class="' + cls + '" style="width:' + p + '%"></i></span><span>' + p + "%</span></div>" +
      '<div class="mute small" style="margin-left:66px">' + esc(until(b.reset)) + "</div>";
  }).join("") + "</div>").join("");
}

function cardHtml(a) {
  const n = esc(a.name);
  const cool = a.cooldown_s ? "（还剩 " + Math.ceil(a.cooldown_s / 60) + " 分钟）" : "";
  return '<div class="card acc s-' + a.status + (a.enabled ? "" : " off") + '">' +
    '<div class="top"><h3>' + n + '</h3><span class="pill s-' + a.status + '"><span class="dot"></span>' + esc(a.status_text + cool) + "</span>" +
    '<span class="sp"></span><label class="switch" title="' + (a.enabled ? "已开启：会被调用" : "已关闭：不会被调用") + '"><input type="checkbox" data-act="toggle" data-name="' + n + '"' + (a.enabled ? " checked" : "") + "><span></span></label></div>" +
    '<div class="row small"><span class="mute">代理</span> ' + (a.proxy ? esc(a.proxy) : '<span class="mute">无</span>') +
    (a.egress_ip ? ' · <span class="mute">出口</span> ' + esc(a.egress_ip) + (a.country ? " " + esc(a.country) : "") : "") + "</div>" +
    (a.verify_url ? '<div class="verify small">Google 要求验证这个账号：<a href="' + esc(a.verify_url) + '" target="_blank" rel="noopener">打开验证页面</a>（浏览器要登录的是这个账号用的 Google 账号），验证完点「检测」。</div>' : "") +
    '<div class="row small"><span class="mute">额度</span> <span class="mute">' + (a.quota_at ? "· " + esc(ago(a.quota_at)) + "读取" : "") + "</span>" + quotaHtml(a) + "</div>" +
    '<div class="row small"><span class="mute">今日</span> 成功 ' + a.today.ok + " · 失败 " + a.today.fail + " · Token " + num(a.today.in) + " / " + num(a.today.out) +
    ' <span class="mute">｜近 7 天</span> ' + a.week.ok + " / " + a.week.fail + "</div>" +
    '<div class="row small"><span class="mute">正在处理</span> ' + a.inflight + " / " + DATA.server.per_account + ' <span class="mute">｜上次检测</span> ' + esc(ago(a.last_check_at)) +
    (a.last_check_msg ? "：" + (a.last_check_ok ? "" : '<span class="err">') + esc(a.last_check_msg) + (a.last_check_ok ? "" : "</span>") : "") + "</div>" +
    (a.last_error ? '<div class="row small"><span class="mute">最近错误（' + esc(ago(a.last_error_at)) + '）</span> <span class="err">' + esc(kindText(a.last_error)).slice(0, 220) + "</span></div>" : "") +
    '<div class="acts">' +
    '<button data-act="check" data-name="' + n + '">检测</button>' +
    '<button data-act="quota" data-name="' + n + '">刷新额度</button>' +
    '<button data-act="login" data-name="' + n + '">重新登录</button>' +
    '<button data-act="proxy" data-name="' + n + '">换代理</button>' +
    '<button data-act="reset" data-name="' + n + '">清除冷却</button>' +
    '<button data-act="delete" data-name="' + n + '" class="danger">删除</button></div></div>';
}

function renderEvents(list) {
  $("#events").innerHTML = list.length ? list.map(e => '<div class="ev ' + esc(e.level) + '"><span class="mute">' + clock(e.t) + '</span><span class="a">' + esc(e.account || "系统") +
    '</span><span class="t">' + esc(kindText(e.text)) + "</span></div>").join("") : '<span class="mute">暂无</span>';
}

// ---------- modal
function openModal(html) { $("#modal").innerHTML = html; $("#mask").style.display = "flex"; }
function closeModal() { $("#mask").style.display = "none"; $("#modal").innerHTML = ""; delete $("#modal").dataset.sticky; }
$("#mask").addEventListener("mousedown", e => { if (e.target.id === "mask" && !$("#modal").dataset.sticky) closeModal(); });
async function busy(btn, fn) { const t = btn.innerHTML; btn.disabled = true; btn.innerHTML = '<span class="spin"></span> ' + t; try { return await fn(); } finally { btn.disabled = false; btn.innerHTML = t; } }
function copy(text) { navigator.clipboard.writeText(text).then(() => toast("已复制", "ok"), () => toast("复制失败，请手动选中复制", "bad")); }

// ---------- account actions
document.addEventListener("change", async e => {
  const el = e.target;
  if (el.dataset.act !== "toggle") return;
  try { await api("/accounts/" + el.dataset.name + "/enabled", {body: {enabled: el.checked}}); toast(el.dataset.name + (el.checked ? " 已开启，会被调用" : " 已关闭，不会再被调用"), "ok"); refresh(); }
  catch (err) { el.checked = !el.checked; toast(err.message, "bad"); }
});
document.addEventListener("click", async e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.top) return topAction(b.dataset.top, b);
  const act = b.dataset.act, name = b.dataset.name; if (!act) return;
  try {
    if (act === "check") { const r = await busy(b, () => api("/accounts/" + name + "/check", {body: {}})); if (r.ok) toast(name + "：" + r.message, "ok"); else if (r.verify_url) verifyModal(name, r.verify_url); else toast(name + "：" + r.message, "bad"); refresh(); }
    if (act === "quota") { await busy(b, () => api("/accounts/" + name + "/quota", {body: {}})); toast(name + " 额度已刷新", "ok"); refresh(); }
    if (act === "reset") { await busy(b, () => api("/accounts/" + name + "/reset", {body: {}})); toast(name + " 已清除冷却和错误标记", "ok"); refresh(); }
    if (act === "login") loginModal(name, false);
    if (act === "proxy") proxyModal(name);
    if (act === "delete") deleteModal(name);
  } catch (err) { toast(err.message, "bad"); }
});

function verifyModal(name, url) {
  openModal('<h3>' + esc(name) + ' 需要 Google 验证</h3><p>Google 要求这个账号先验证身份，暂时不能用（网关会自动用别的账号顶上）。</p><ol>' +
    '<li>点下面的按钮，在浏览器里打开验证页面（浏览器里登录的必须是 <b>' + esc(name) + '</b> 用的那个 Google 账号）。</li><li>按页面提示完成验证，一般是手机号收短信验证码。</li><li>验证完回到这里，点账号卡片上的「检测」。</li></ol>' +
    '<p><a href="' + esc(url) + '" target="_blank" rel="noopener"><button class="primary">打开验证页面</button></a></p><div class="foot"><button onclick="closeModal()">关闭</button></div>');
}

function proxyModal(name) {
  openModal('<h3>' + esc(name) + ' 换代理</h3><div class="field"><label>新的代理地址（例如 socks5://用户名:密码@1.2.3.4:1080）</label><input id="pxIn" type="password" autocomplete="off"></div>' +
    '<label class="small mute"><input type="checkbox" style="width:auto" onchange="pxIn.type=this.checked?\'text\':\'password\'"> 显示</label><p class="small mute">保存前会先测这个代理的出口 IP。保存后这个账号会用新代理重新连接。</p>' +

async function proxyTable(compact) {
  const rows = (await api("/proxies")).proxies;
  if (!rows.length) return '<p class="mute small">还没有用过任何代理。</p>';
  const dup = rows.filter(r => r.shared_with.length).length;
  return (dup ? '<p class="small err">标红的代理（或出口 IP）被不止一个账号用过：Google 可能把这些账号当成同一个人。</p>' : "") +
    '<div style="overflow:auto;max-height:' + (compact ? "220px" : "60vh") + '"><table style="width:100%;border-collapse:collapse;font-size:12.5px">' +

    rows.map(r => '<tr style="border-top:1px solid var(--line)' + (r.shared_with.length ? ";color:var(--bad)" : "") + '">' +
      '<td style="padding:5px 4px;word-break:break-all"><code>' + esc(r.proxy) + "</code>" + (r.shared_with.length ? '<div class="small">也被 ' + esc(r.shared_with.join("、")) + " 用过</div>" : "") + "</td>" +

let UPD_TIMER = null;
async function updateModal() {
  let u;
  try { u = await api("/update"); } catch (e) { toast(e.message, "bad"); return; }
  const busyNow = u.state === "running" || u.state === "restarting";
  openModal("<h3>版本更新</h3>" +
    '<p class="small">当前版本 <b>v' + esc(u.current) + "</b>" + (u.latest ? " · GitHub 最新 <b>v" + esc(u.latest) + "</b>" : "") +
    (u.checked_at ? ' <span class="mute">（' + esc(ago(u.checked_at)) + "检查）</span>" : "") + "</p>" +
    (u.error ? '<p class="small err">' + esc(u.error) + "</p>" : "") +
    (u.available ? notesHtml(u.notes) : (u.latest ? '<p class="small" style="color:var(--ok)">已经是最新版本。</p>' : "")) +
    (u.available && !busyNow ? (u.can_apply ? '<p class="small mute">「立即更新」会从 GitHub 拉取最新代码、装好依赖，等正在处理的请求做完后自动重启网关（一般 1 分钟内）。账号、密钥、面板密码和统计都保留。</p>' : manualHtml(u)) : "") +
    '<pre class="small" id="updLog" style="max-height:220px;overflow:auto;white-space:pre-wrap;display:' + (u.log ? "block" : "none") + '">' + esc(u.log || "") + "</pre>" +
    '<div class="foot"><button id="updCheck">立即检查</button>' + (u.available && u.can_apply && !busyNow ? '<button class="primary" id="updApply">立即更新</button>' : "") +
    '<button onclick="closeModal()">关闭</button></div>');
  $("#updCheck").onclick = async e => { try { await busy(e.target, () => api("/update/check", {body: {}})); await refresh(); updateModal(); } catch (err) { toast(err.message, "bad"); } };
  if ($("#updApply")) $("#updApply").onclick = async e => {
    if (!confirm("现在更新到 v" + u.latest + "？更新完网关会自动重启一次。")) return;
    try { await busy(e.target, () => api("/update/apply", {body: {}})); followUpdate(u.current); } catch (err) { toast(err.message, "bad"); }
  };
  if (busyNow) followUpdate(u.current);
}
function followUpdate(fromVersion) {
  clearInterval(UPD_TIMER);
  const t0 = Date.now();
  UPD_TIMER = setInterval(async () => {
    try {
      const u = await api("/update");
      const log = $("#updLog");
      if (log) { log.style.display = "block"; log.textContent = u.log || "正在开始…"; log.scrollTop = log.scrollHeight; }
      if (u.current !== fromVersion) { clearInterval(UPD_TIMER); toast("已更新到 v" + u.current, "ok"); closeModal(); refresh(); return; }
      if (u.state === "failed") { clearInterval(UPD_TIMER); toast("更新失败，网关还在用 v" + fromVersion + "（看窗口里的日志）", "bad"); }
    } catch (e) { const log = $("#updLog"); if (log) log.textContent += "\n…网关正在重启"; }
    if (Date.now() - t0 > 20 * 60 * 1000) clearInterval(UPD_TIMER);
  }, 2500);
}

    '<p class="small mute">巡检就是读一次额度：<b>不消耗额度</b>，顺便刷新 Google 登录令牌、确认代理和登录都还正常。发现登录失效会把账号标成「需要重新登录」，不再派活给它。</p>' +
    '<label><input type="checkbox" id="stPrompt" style="width:auto"' + (s.prompt_check ? " checked" : "") + '> 每天再用每个账号真发一句话</label>' +
    '<p class="small mute">能提前发现「Google 要求验证」（读额度发现不了这种情况），每个账号每天消耗一次极小的额度。不开也没关系：真有请求碰到时，网关会自动换号，并在卡片上显示验证按钮。</p>' +
    '<div class="foot" style="justify-content:flex-start"><button class="primary" id="stSave">保存巡检设置</button></div>' +
    '<h4 style="margin:18px 0 6px">修改面板密码</h4><div class="field"><input id="pwOld" type="password" placeholder="原密码"></div><div class="field"><input id="pwNew" type="password" placeholder="新密码（至少 8 位）"></div>' +
    '<div class="foot" style="justify-content:flex-start"><button id="pwSave">修改密码</button></div><div class="foot"><button onclick="closeModal()">关闭</button></div>');
  $("#stSave").onclick = async e => { try { await busy(e.target, () => api("/settings", {body: {auto_check: $("#stAuto").checked, check_hours: +$("#stHours").value, prompt_check: $("#stPrompt").checked}})); toast("巡检设置已保存", "ok"); refresh(); } catch (err) { toast(err.message, "bad"); } };
  $("#stUpdSave").onclick = async e => { try { await busy(e.target, () => api("/settings", {body: {update_check: $("#stUpd").checked}})); toast("已保存", "ok"); refresh(); } catch (err) { toast(err.message, "bad"); } };
  $("#stUpdOpen").onclick = () => updateModal();
  $("#stPerSave").onclick = async e => { try { await busy(e.target, () => api("/settings", {body: {per_account: +$("#stPer").value}})); toast("已保存，立即生效", "ok"); closeModal(); refresh(); } catch (err) { toast(err.message, "bad"); } };
  $("#pwSave").onclick = async e => { try { await busy(e.target, () => api("/password", {body: {old: $("#pwOld").value, new: $("#pwNew").value}})); toast("密码已修改，其它设备上的登录已退出", "ok"); closeModal(); refresh(); } catch (err) { toast(err.message, "bad"); } };
}

api("/overview").then(() => start()).catch(() => showLogin());
</script>
</body>
</html>
